name: 'Release Package'
description: 'Release a package using release-it'

inputs:
  package:
    description: 'Full package name (e.g., @passionui/react-native-foundation)'
    required: true
  release-type:
    description: 'Type of release (beta, alpha, rc, patch, minor, major)'
    required: true
  npm-token:
    description: 'NPM authentication token'
    required: true
  github-token:
    description: 'GitHub authentication token'
    required: true

outputs:
  version:
    description: 'The released version'
    value: ${{ steps.get-version.outputs.version }}
  tag:
    description: 'The git tag created'
    value: ${{ steps.get-version.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Configure Git and NPM
      shell: bash
      run: |
        # Configure Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Configure NPM
        echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" > ~/.npmrc

    - name: Release package
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        RELEASE_TYPE="${{ inputs.release-type }}"

        case "$RELEASE_TYPE" in
          beta|alpha|rc)
            npx release-it --workspace=${{ inputs.package }} --ci --preRelease=$RELEASE_TYPE
            ;;
          patch|minor|major)
            npx release-it --workspace=${{ inputs.package }} --ci $RELEASE_TYPE
            ;;
        esac

    - name: Get released version
      id: get-version
      shell: bash
      run: |
        # Wait a moment for npm registry to update
        sleep 2

        # Determine the dist-tag based on release type
        RELEASE_TYPE="${{ inputs.release-type }}"
        case "$RELEASE_TYPE" in
          beta)
            DIST_TAG="beta"
            ;;
          alpha)
            DIST_TAG="alpha"
            ;;
          rc)
            DIST_TAG="rc"
            ;;
          patch|minor|major)
            DIST_TAG="latest"
            ;;
        esac

        # Get version from npm registry using the dist-tag
        VERSION=$(npm view ${{ inputs.package }}@${DIST_TAG} version)

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Published version: $VERSION (dist-tag: $DIST_TAG)"

    - name: Cleanup NPM config
      if: always()
      shell: bash
      run: rm -f ~/.npmrc

