name: 'Release Package'
description: 'Release a package using release-it'

inputs:
  package:
    description: 'Full package name (e.g., @passionui/react-native-foundation)'
    required: true
  release-type:
    description: 'Type of release (beta, patch, minor, major, etc.)'
    required: true
  npm-token:
    description: 'NPM authentication token'
    required: true
  github-token:
    description: 'GitHub authentication token'
    required: true

outputs:
  version:
    description: 'The released version'
    value: ${{ steps.get-version.outputs.version }}
  tag:
    description: 'The git tag created'
    value: ${{ steps.get-version.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Configure Git
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Configure NPM
      shell: bash
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" > ~/.npmrc

    - name: Get package short name
      id: pkg-name
      shell: bash
      run: |
        # Extract short name from package
        # @passionui/react-native-foundation -> foundation
        SHORT_NAME=$(echo "${{ inputs.package }}" | sed 's/@passionui\/react-native-//')
        echo "short=$SHORT_NAME" >> $GITHUB_OUTPUT

    - name: Release package
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        # Use root workspace script that handles directory
        RELEASE_TYPE="${{ inputs.release-type }}"
        SHORT_NAME="${{ steps.pkg-name.outputs.short }}"

        case "$RELEASE_TYPE" in
          beta|alpha|rc)
            npm run release:${SHORT_NAME}:${RELEASE_TYPE}
            ;;
          patch|minor|major)
            npm run release:${SHORT_NAME}:${RELEASE_TYPE}
            ;;
        esac

    - name: Get released version
      id: get-version
      shell: bash
      run: |
        # Read version from package.json in workspace
        VERSION=$(npm pkg get version --workspace=${{ inputs.package }} | tr -d '"')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT

    - name: Cleanup NPM config
      if: always()
      shell: bash
      run: rm -f ~/.npmrc

