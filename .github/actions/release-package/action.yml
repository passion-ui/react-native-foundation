name: 'Release Package'
description: 'Release a package using release-it'

inputs:
  package:
    description: 'Package short name (e.g., foundation)'
    required: true
  release-type:
    description: 'Type of release (latest, beta, alpha)'
    required: true
  npm-token:
    description: 'NPM authentication token'
    required: true
  github-token:
    description: 'GitHub authentication token'
    required: true

outputs:
  name:
    description: 'The package name'
    value: ${{ steps.pkg-dir.outputs.name }}
  version:
    description: 'The released version'
    value: ${{ steps.get-version.outputs.version }}
  tag:
    description: 'The git tag created'
    value: ${{ steps.get-version.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Configure Git and NPM
      shell: bash
      run: |
        # Configure Git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Configure NPM authentication globally (for npm view commands)
        echo "//registry.npmjs.org/:_authToken=${{ inputs.npm-token }}" > ~/.npmrc


    - name: Get package directory
      id: pkg-dir
      shell: bash
      run: |
        # Get full package name from package.json
        NAME=$(node -p "require('./packages/${{ inputs.package }}/package.json').name")
        echo "name=$NAME" >> $GITHUB_OUTPUT

    - name: Release package
      shell: bash
      working-directory: packages/${{ inputs.package }}
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        NPM_TOKEN: ${{ inputs.npm-token }}
      run: |
        RELEASE_TYPE="${{ inputs.release-type }}"

        git status

        case "$RELEASE_TYPE" in
          beta)
            npx release-it --ci --preRelease=beta
            ;;
          alpha)
            npx release-it --ci --preRelease=alpha
            ;;
          latest)
            npx release-it --ci patch
            ;;
        esac

    - name: Get released version
      id: get-version
      shell: bash
      run: |
        # Wait a moment for npm registry to update
        sleep 30

        # Determine the dist-tag based on release type
        RELEASE_TYPE="${{ inputs.release-type }}"
        case "$RELEASE_TYPE" in
          beta)
            DIST_TAG="beta"
            ;;
          alpha)
            DIST_TAG="alpha"
            ;;
          latest)
            DIST_TAG="latest"
            ;;
        esac

        # Get version from npm registry using the dist-tag
        VERSION=$(npm view ${{ steps.pkg-dir.outputs.name }}@${DIST_TAG} version)

        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        echo "✅ Published version: $VERSION (dist-tag: $DIST_TAG)"

    - name: Cleanup NPM config
      if: always()
      shell: bash
      run: rm -f ~/.npmrc

