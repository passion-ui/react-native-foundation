name: 'Build Package'
description: 'Build and typecheck a package using workspace name'

inputs:
  package:
    description: 'Package short name (e.g., foundation)'
    required: true

runs:
  using: composite
  steps:
    - name: Clean package
      shell: bash
      working-directory: packages/${{ inputs.package }}
      run: yarn run clean

    - name: Type check package
      shell: bash
      working-directory: packages/${{ inputs.package }}
      run: yarn run typecheck

    - name: Build package
      shell: bash
      working-directory: packages/${{ inputs.package }}
      run: yarn run build

