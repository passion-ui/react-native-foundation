name: 'Build Package'
description: 'Build and typecheck a package using workspace name'

inputs:
  package:
    description: 'Full package name (e.g., @passionui/react-native-foundation)'
    required: true

runs:
  using: composite
  steps:
    - name: Clean package
      shell: bash
      run: yarn clean --workspace=${{ inputs.package }}

    - name: Type check package
      shell: bash
      run: yarn typecheck --workspace=${{ inputs.package }}

    - name: Build package
      shell: bash
      run: yarn build --workspace=${{ inputs.package }}

