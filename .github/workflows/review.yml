name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-branch:
    name: Validate Branch
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"

          # Allowed patterns: feature/*, fix/*, docs/*, chore/*, refactor/*, perf/*, test/*
          if [[ ! "$BRANCH_NAME" =~ ^(feature|fix|docs|chore|refactor|perf|test)/.+ ]]; then
            echo "❌ Invalid branch name: $BRANCH_NAME"
            echo ""
            echo "Branch name must follow one of these patterns:"
            echo "  - feature/description"
            echo "  - fix/description"
            echo "  - docs/description"
            echo "  - chore/description"
            echo "  - refactor/description"
            echo "  - perf/description"
            echo "  - test/description"
            echo ""
            echo "Examples:"
            echo "  - feature/add-button-component"
            echo "  - fix/resolve-input-validation"
            echo "  - docs/update-readme"
            exit 1
          fi

          echo "✅ Branch name is valid: $BRANCH_NAME"

  # Verify code quality
  verify-code:
    name: Verify Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install

      - name: Detect changed packages and verify
        id: verify
        run: |
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # Detect which packages were modified
          PACKAGES=""
          if echo "$CHANGED_FILES" | grep -q "^packages/foundation/"; then
            PACKAGES="foundation"
          fi

          if [ -z "$PACKAGES" ]; then
            echo "ℹ️ No package changes detected"
            exit 0
          fi

          echo "📦 Changed packages: $PACKAGES"

          # Verify foundation package if changed
          if echo "$PACKAGES" | grep -q "foundation"; then
            echo ""
            echo "🔍 Type checking foundation package..."
            npm run typecheck --workspace=@passionui/react-native-foundation

            echo ""
            echo "🏗️ Building foundation package..."
            npm run build --workspace=@passionui/react-native-foundation

            echo ""
            echo "✅ Verifying build output..."
            if [ ! -d "packages/foundation/lib" ]; then
              echo "❌ Build failed: lib directory not found"
              exit 1
            fi
            echo "✅ Build successful - lib directory created"
          fi

          echo ""
          echo "✅ All verifications passed!"

  # Summary
  review-complete:
    name: Review Complete
    runs-on: ubuntu-latest
    needs: [validate-branch, verify-code]
    if: always()

    steps:
      - name: Check status
        run: |
          if [ "${{ needs.validate-branch.result }}" != "success" ]; then
            echo "❌ Branch validation failed"
            exit 1
          fi

          if [ "${{ needs.verify-code.result }}" != "success" ]; then
            echo "❌ Code verification failed"
            exit 1
          fi

          echo "✅ All checks passed!"
          echo ""
          echo "📋 Summary:"
          echo "  ✅ Branch name is valid"
          echo "  ✅ Code verified (typecheck + build)"
          echo ""
          echo "🎉 This PR is ready for human review!"

